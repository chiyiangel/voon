[package]
name = "voon-core"
description = "Library model, scanner and index for Voon. No GUI dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chardetng = "1"
encoding_rs = "0.8"
id3 = "1"
lofty = "0.25"
regex = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
encoding_rs = "0.8"
tempfile = "3"
