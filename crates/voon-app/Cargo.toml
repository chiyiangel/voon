[package]
name = "voon-app"
description = "Voon: organize a NAS music library on macOS."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "voon"
path = "src/main.rs"

[dependencies]
gpui = "0.2"
unicode-segmentation = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
voon-core.workspace = true

[dev-dependencies]
tempfile = "3"
gpui = { version = "0.2", features = ["test-support"] }

# gpui 0.2 pulls xattr 0.2.3 (via zed-async-tar), which needs `libc::ENOATTR`
# on Linux; libc 0.2.190 dropped it. Remove once the chain moves on.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "<0.2.190"
